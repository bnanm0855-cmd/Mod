<head>

<title>Barber Pro | منصة إدارة صالونات الحلاقة</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--ink:#17233b;--muted:#71809a;--line:#e5ebf3;--blue:#1769e0;--blue2:#0d4fb5;--green:#0ca678;--gold:#e5a323;--purple:#7654df;--red:#df5362;--shadow:0 12px 35px rgba(29,55,94,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.topbar{height:76px;background:#101d35;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10;box-shadow:0 5px 20px #09152a30}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}.brandmark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#f5bd4c,#e88b26);display:grid;place-items:center;color:#13213a;font-size:24px}.top-actions{display:flex;align-items:center;gap:10px}.role-switch{background:#243652;color:#fff;border:1px solid #3a4c69;border-radius:12px;padding:10px 13px}.user-chip{background:#20314e;border-radius:30px;padding:9px 14px;font-size:13px}.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 76px)}.sidebar{background:#fff;border-left:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;gap:7px}.side-title{font-size:11px;color:#9aa6b8;font-weight:700;padding:8px 12px 12px}.nav-btn{display:flex;align-items:center;gap:12px;text-align:right;background:transparent;color:#56647c;padding:13px 14px;border-radius:12px;font-size:14px;transition:.2s}.nav-btn:hover{background:#f1f5fc;color:var(--blue)}.nav-btn.active{background:#eaf2ff;color:var(--blue);font-weight:700}.nav-ico{width:23px;text-align:center;font-size:17px}.sidebar-foot{margin-top:auto;background:#f5f8fd;border-radius:14px;padding:14px;color:#697993;font-size:12px;line-height:1.8}.main{padding:28px;max-width:1500px;width:100%;margin:0 auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.page-head h1{font-size:25px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px}.btn{padding:11px 16px;border-radius:11px;background:var(--blue);color:#fff;font-weight:700;font-size:13px}.btn:hover{background:var(--blue2)}.btn.light{background:#edf3fc;color:#24558f}.btn.green{background:var(--green)}.btn.gold{background:var(--gold);color:#17233b}.btn.small{padding:8px 11px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:19px;display:flex;align-items:center;gap:14px}.stat-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px}.stat strong{display:block;font-size:23px;margin:5px 0}.stat small{color:var(--muted);font-size:12px}.blue{background:#e8f1ff;color:#2169d5}.greenbg{background:#e4f8f0;color:#07956a}.goldbg{background:#fff4db;color:#bd8110}.purplebg{background:#f0eaff;color:#7756d8}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.card{padding:20px;margin-bottom:18px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.card h3{margin:0;font-size:16px}.muted{color:var(--muted);font-size:12px}.bars{height:180px;display:flex;align-items:end;gap:13px;padding:18px 8px 0;border-bottom:1px solid var(--line)}.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:end;color:var(--muted);font-size:11px}.bar{width:100%;max-width:36px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#54a0ff,#1769e0);min-height:8px}.list{display:flex;flex-direction:column;gap:11px}.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf1f6}.list-row:last-child{border:0}.person{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#dbeafe,#a8c9ff);display:grid;place-items:center;color:#23569a;font-weight:800}.status{font-size:11px;padding:5px 9px;border-radius:20px;background:#e5f8ef;color:#0b966b}.status.pending{background:#fff4dc;color:#b47a10}.status.off{background:#ffe9eb;color:#c33d4b}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:right;color:#8190a6;font-size:11px;font-weight:700;background:#f7f9fc}td,th{padding:13px 12px;border-bottom:1px solid #edf1f6}tr:last-child td{border-bottom:0}.table-wrap{overflow:auto}.pill{padding:5px 9px;border-radius:20px;background:#edf3fc;color:#315f9c;font-size:11px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:#62718a;font-weight:700}.field input,.field select{border:1px solid #dce4ef;background:#fff;border-radius:10px;padding:12px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#77a9ef;box-shadow:0 0 0 3px #e8f1ff}.empty{padding:30px;text-align:center;color:var(--muted)}.barber-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.barber-card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.barber-cover{height:95px;background:linear-gradient(120deg,#10213c,#235a9e);position:relative}.barber-avatar{position:absolute;bottom:-28px;right:18px;width:66px;height:66px;border:4px solid #fff;border-radius:50%;background:#d9e8ff;display:grid;place-items:center;font-size:25px}.barber-body{padding:38px 17px 17px}.barber-body h3{margin:0 0 6px}.rating{color:#e5a323;font-size:12px}.barber-body p{font-size:12px;color:var(--muted);line-height:1.7}.barber-meta{display:flex;justify-content:space-between;font-size:12px;margin:12px 0}.barber-actions{display:flex;gap:8px}.barber-actions button{flex:1}.hero{background:linear-gradient(110deg,#10213c,#1e5795);color:#fff;border-radius:20px;padding:26px 28px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero h2{margin:0 0 8px;font-size:23px}.hero p{margin:0;color:#d6e5fa;font-size:13px}.hero-mark{font-size:55px;opacity:.9}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{padding:9px 13px;border-radius:10px;background:#fff;color:#60718b;border:1px solid var(--line);font-size:12px}.tab.active{background:#eaf2ff;color:var(--blue);border-color:#c9ddfb;font-weight:700}.notice{background:#fff8e9;border:1px solid #f4dfac;color:#946b16;padding:13px 15px;border-radius:12px;font-size:12px;line-height:1.8;margin-bottom:18px}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:22px;background:#14233d;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:30;opacity:0;transform:translateY(10px);transition:.25s}.toast.show{opacity:1;transform:translateY(0)}.modal-back{position:fixed;inset:0;background:#0b1730a8;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:#fff;border-radius:18px;padding:23px;width:min(520px,100%);box-shadow:0 25px 80px #0003}.modal h3{margin:0 0 18px}.modal-actions{display:flex;justify-content:flex-start;gap:9px;margin-top:18px}.mobile-menu{display:none}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.barber-grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:720px){.topbar{padding:0 14px;height:66px}.brand{font-size:16px}.user-chip{display:none}.layout{display:block}.sidebar{position:fixed;z-index:15;top:66px;bottom:0;right:0;width:260px;transform:translateX(105%);transition:.25s;box-shadow:-10px 0 30px #14233d20}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-block;background:#243652;color:white;border-radius:10px;padding:9px 12px}.main{padding:19px 13px}.page-head{align-items:center}.page-head h1{font-size:20px}.stats{gap:9px}.stat{padding:13px;gap:9px}.stat-icon{width:38px;height:38px;font-size:18px}.stat strong{font-size:18px}.stat small{font-size:10px}.barber-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.hero{padding:20px}.hero h2{font-size:19px}.hero-mark{font-size:40px}.role-switch{font-size:11px;padding:9px}.top-actions{gap:6px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="brand"><button class="mobile-menu" onclick="toggleMenu()">☰</button><span class="brandmark">✂</span><span>Barber Pro <small style="display:block;font-size:10px;color:#b8c8df;font-weight:400">منصة إدارة صالونات الحلاقة</small></span></div>
 <div class="top-actions"><span class="user-chip" id="currentUser">مرحباً، مدير المنصة</span><select class="role-switch" id="roleSelect" onchange="switchRole(this.value)" aria-label="اختيار الواجهة"><option value="admin">واجهة المدير العام</option><option value="barber">واجهة الحلاق</option><option value="customer">واجهة الزبائن</option></select></div>
</header>
<div class="layout">
<aside class="sidebar" id="sidebar"><div class="side-title" id="sideTitle">إدارة المنصة</div><nav id="nav"></nav><div class="sidebar-foot">Barber Pro<br>نسخة تجريبية أولية<br>بيانات العرض محفوظة على هذا الجهاز.</div></aside>
<main class="main" id="main"></main>
</div>
</div>
<div class="toast" id="toast"></div><div id="modalRoot"></div>
<script>
const menus={
 admin:[['الرئيسية','⌂','dashboard'],['إدارة الصالونات','▣','shops'],['إدارة الاشتراكات','▤','subscriptions'],['إدارة المستخدمين','♙','users'],['التقارير والإحصائيات','▥','reports'],['الإعدادات العامة','⚙','settings'],['الدعم والمساعدة','?','support'],['تسجيل الخروج','⇥','logout']],
 barber:[['الرئيسية','⌂','dashboard'],['مواعيدي','▦','appointments'],['زبائني','♙','clients'],['الخدمات والأسعار','✂','services'],['الجدول اليومي','◷','schedule'],['الإيرادات','＄','income'],['الإعدادات','⚙','settings'],['تسجيل الخروج','⇥','logout']],
 customer:[['الرئيسية','⌂','home'],['الحلاقون','♙','barbers'],['حجوزاتي','▦','mybookings'],['المفضلة','♡','favorites'],['حسابي','⚙','account'],['الدعم والمساعدة','?','support'],['تسجيل الخروج','⇥','logout']]
};
let role='admin',page='dashboard',selectedBarber=null;
let bookings=JSON.parse(localStorage.getItem('bp_bookings')||'[]');
let barbers=[{name:'أحمد الحلاق',shop:'صالون الرجولة',rating:'4.9',price:120,available:'متاح اليوم',initial:'أ'},{name:'محمد الحلاق',shop:'صالون الأناقة',rating:'4.7',price:100,available:'متاح اليوم',initial:'م'},{name:'مازن الحلاق',shop:'صالون الجمال',rating:'4.8',price:130,available:'متاح غداً',initial:'ز'}];
function save(){localStorage.setItem('bp_bookings',JSON.stringify(bookings))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function switchRole(r){role=r;page=menus[r][0][2];document.getElementById('currentUser').textContent=r==='admin'?'مرحباً، مدير المنصة':r==='barber'?'مرحباً، أحمد الحلاق':'مرحباً، الزبون';render()}
function go(p){page=p;document.getElementById('sidebar').classList.remove('open');render()}
function navRender(){document.getElementById('sideTitle').textContent=role==='admin'?'إدارة المنصة':role==='barber'?'لوحة الحلاق':'حساب الزبون';document.getElementById('nav').innerHTML=menus[role].map(m=>`<button class="nav-btn ${page===m[2]?'active':''}" onclick="go('${m[2]}')"><span class="nav-ico">${m[1]}</span>${m[0]}</button>`).join('')}
function head(title,sub,action=''){return `<div class="page-head"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}
function stat(icon,label,value,cls,small){return `<div class="stat"><div class="stat-icon ${cls}">${icon}</div><div><small>${label}</small><strong>${value}</strong><small>${small||''}</small></div></div>`}
function dashboardAdmin(){return `${head('لوحة تحكم المدير العام','نظرة شاملة على أداء المنصة وإدارة الصالونات.','<button class="btn" onclick="go(&#39;shops&#39;)">＋ إضافة صالون</button>')}
<div class="stats">${stat('▣','عدد الصالونات','12','blue','صالون مسجل')}${stat('▦','إجمالي الحجوزات','1,240','greenbg','هذا الشهر')}${stat('＄','إجمالي الإيرادات','$8,750','goldbg','إيرادات الاشتراكات')}${stat('♙','المستخدمون','86','purplebg','مديرون وحلاقون وزبائن')}</div>
<div class="grid2"><section class="card"><div class="card-head"><h3>إحصائيات عامة</h3><span class="muted">آخر 6 أشهر</span></div><div class="bars">${[['يناير',42],['فبراير',58],['مارس',35],['أبريل',73],['مايو',55],['يونيو',88]].map(x=>`<div class="bar-col"><div class="bar" style="height:${x[1]}%"></div>${x[0]}</div>`).join('')}</div></section>
<section class="card"><div class="card-head"><h3>تنبيهات مهمة</h3><span class="muted">متابعة المنصة</span></div><div class="list"><div class="list-row"><span>انتهاء اشتراك صالون الأناقة</span><span class="status pending">بعد 3 أيام</span></div><div class="list-row"><span>طلب تسجيل صالون جديد</span><span class="status">جديد</span></div><div class="list-row"><span>اشتراك تم تجديده</span><span class="status">مكتمل</span></div></div></section></div>
<section class="card"><div class="card-head"><h3>أحدث الاشتراكات</h3><button class="btn light small" onclick="go('subscriptions')">عرض الكل</button></div>${table(['الصالون','الباقة','الحالة','تاريخ الانتهاء'],[['صالون الجمال','احترافية','نشط','30-12-2026'],['صالون الأناقة','أساسية','قارب على الانتهاء','19-11-2026'],['صالون الرجولة','سنوية','نشط','01-08-2027']])}</section>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function adminPage(){if(page==='dashboard')return dashboardAdmin();let data={
shops:['إدارة الصالونات','إضافة الصالونات ومراجعة بياناتها وحالة نشاطها.','إضافة صالون',['اسم الصالون','اسم المالك','البريد الإلكتروني','رقم الهاتف','المدينة'],[['صالون الرجولة','أحمد','ahmad@example.com','0500000001','كليس'],['صالون الأناقة','محمد','m@example.com','0500000002','كليس'],['صالون الجمال','مازن','mzn@example.com','0500000003','غازي عنتاب']]],
subscriptions:['إدارة الاشتراكات','متابعة الباقات والمدفوعات وتواريخ التجديد.','إنشاء باقة',['اسم الصالون','الباقة','قيمة الاشتراك','الحالة','الانتهاء'],[['صالون الرجولة','سنوية','$99','نشط','01-08-2027'],['صالون الأناقة','شهرية','$12','قارب على الانتهاء','19-11-2026'],['صالون الجمال','احترافية','$19','نشط','30-12-2026']]],
users:['إدارة المستخدمين','إدارة حسابات مديري الصالونات والحلاقين والزبائن.','إضافة مستخدم',['الاسم','نوع الحساب','البريد','الحالة'],[['أحمد','حلاق','ahmad@example.com','نشط'],['محمد','مدير صالون','m@example.com','نشط'],['علي','زبون','ali@example.com','نشط']]],
reports:['التقارير والإحصائيات','ملخص أداء المنصة والحجوزات والاشتراكات.','تصدير التقرير',['المؤشر','القيمة','الفترة'],[['الصالونات النشطة','12','حالياً'],['الحجوزات','1,240','هذا الشهر'],['إيرادات الاشتراكات','$8,750','هذا الشهر']]],
settings:['الإعدادات العامة','إعدادات المنصة والأمان والاشتراكات.','حفظ الإعدادات',['الإعداد','القيمة'],[['اسم المنصة','Barber Pro'],['مدة التجربة المجانية','7 أيام'],['العملة الافتراضية','USD']]],
support:['الدعم والمساعدة','متابعة طلبات المساعدة والتواصل مع أصحاب الصالونات.','تذكرة جديدة',['رقم الطلب','صاحب الطلب','الموضوع','الحالة'],[['#102','صالون الأناقة','مشكلة في الاشتراك','قيد المتابعة'],['#101','أحمد','تعديل بيانات الصالون','مكتمل']]]
};let d=data[page]||data.shops;return `${head(d[0],d[1],`<button class="btn" onclick="addItem('${page}')">＋ ${d[2]}</button>`)}<section class="card"><div class="card-head"><h3>${d[0]}</h3><span class="muted">بيانات تجريبية للعرض</span></div>${table(d[3],d[4])}</section>`}
function dashboardBarber(){return `${head('لوحة الحلاق','مرحباً أحمد، إليك ملخص عملك اليوم.','<button class="btn" onclick="go(&#39;appointments&#39;)">عرض المواعيد</button>')}<div class="stats">${stat('▦','مواعيد اليوم','5','blue','موعد')}${stat('♙','عدد الزبائن','28','greenbg','زبون مسجل')}${stat('＄','إيرادات اليوم','650 ل.ت','goldbg','إجمالي الخدمات')}${stat('◷','المواعيد القادمة','3','purplebg','خلال الساعات القادمة')}</div><div class="grid2"><section class="card"><div class="card-head"><h3>مواعيدي القادمة</h3><button class="btn light small" onclick="go('appointments')">كل المواعيد</button></div><div class="list">${[['أحمد محمد','10:30','قص شعر'],['علي حسن','11:15','قص شعر ولحية'],['محمد خالد','12:00','تحديد لحية']].map(x=>`<div class="list-row"><div><b>${x[0]}</b><div class="muted">${x[2]}</div></div><span class="pill">${x[1]}</span></div>`).join('')}</div></section><section class="card"><div class="card-head"><h3>تنبيهات</h3></div><div class="list"><div class="list-row">لديك حجز جديد <span class="status">جديد</span></div><div class="list-row">تذكير بموعد الساعة 10:30 <span class="status pending">قريباً</span></div></div></section></div>`}
function barberPage(){if(page==='dashboard')return dashboardBarber();let titles={appointments:['مواعيدي','إدارة الحجوزات القادمة والسابقة.'],clients:['زبائني','قائمة الزبائن وسجل زياراتهم.'],services:['الخدمات والأسعار','إدارة الخدمات التي تقدمها وأسعارها.'],schedule:['الجدول اليومي','تنظيم ساعات العمل وأوقات الاستراحة.'],income:['الإيرادات','متابعة دخلك من الخدمات والحجوزات.'],settings:['الإعدادات','إعدادات ملفك الشخصي ومواعيد العمل.']};let t=titles[page]||titles.appointments;let content='';
if(page==='appointments')content=table(['الزبون','الخدمة','التاريخ','الوقت','الحالة'],[['أحمد محمد','قص شعر','اليوم','10:30','<span class="status">مؤكد</span>'],['علي حسن','قص شعر ولحية','اليوم','11:15','<span class="status">مؤكد</span>'],['محمد خالد','تحديد لحية','اليوم','12:00','<span class="status pending">بانتظار التأكيد</span>']]);
if(page==='clients')content=table(['الزبون','رقم الهاتف','آخر زيارة','عدد الزيارات'],[['أحمد محمد','0500000001','اليوم','8'],['علي حسن','0500000002','أمس','4'],['محمد خالد','0500000003','10-11-2026','2']]);
if(page==='services')content=table(['الخدمة','المدة','السعر'],[['قص شعر','30 دقيقة','120 ل.ت'],['قص شعر ولحية','45 دقيقة','170 ل.ت'],['تحديد لحية','20 دقيقة','70 ل.ت']]);
if(page==='schedule')content='<div class="notice">حدد ساعات العمل التي يستطيع الزبائن الحجز خلالها، واحرص على تحديث الإجازات والاستراحات.</div>'+table(['اليوم','بداية الدوام','نهاية الدوام','الحالة'],[['الاثنين - الجمعة','09:00','21:00','متاح'],['السبت','10:00','20:00','متاح'],['الأحد','—','—','إجازة']]);
if(page==='income')content=table(['الفترة','عدد الخدمات','الإيرادات'],[['اليوم','5','650 ل.ت'],['هذا الأسبوع','27','3,400 ل.ت'],['هذا الشهر','96','12,800 ل.ت']]);
if(page==='settings')content=`<div class="form-grid"><div class="field"><label>اسم الحلاق</label><input value="أحمد الحلاق"></div><div class="field"><label>اسم الصالون</label><input value="صالون الرجولة"></div><div class="field"><label>رقم الهاتف</label><input value="0500000000"></div><div class="field"><label>مدة الموعد الافتراضية</label><select><option>30 دقيقة</option><option>45 دقيقة</option><option>60 دقيقة</option></select></div></div><p><button class="btn" onclick="toast('تم حفظ الإعدادات التجريبية')">حفظ الإعدادات</button></p>`;
return `${head(t[0],t[1],page==='services'?'<button class="btn" onclick="toast(&#39;يمكن إضافة الخدمة في النسخة التالية&#39;)">＋ إضافة خدمة</button>':'') }<section class="card">${content}</section>`}
function customerHome(){return `${head('احجز موعدك الآن','اختر الحلاق المناسب لك واحجز موعدك بسهولة.')}<div class="hero"><div><h2>إطلالة جديدة تبدأ بحجز بسيط</h2><p>تصفح الحلاقين، قارن الخدمات والأسعار، واختر الوقت المناسب لك.</p></div><div class="hero-mark">✂</div></div><div class="card-head"><h3>الحلاقون المتوفرون</h3><span class="muted">${barbers.length} حلاقين</span></div>${barberCards()}`}
function barberCards(){return `<div class="barber-grid">${barbers.map((b,i)=>`<article class="barber-card"><div class="barber-cover"><div class="barber-avatar">${b.initial}</div></div><div class="barber-body"><h3>${b.name}</h3><div class="muted">${b.shop}</div><div class="rating">★ ${b.rating} <span class="muted">• تقييم الزبائن</span></div><p>خدمات حلاقة وعناية شخصية، مع إمكانية اختيار الموعد المناسب.</p><div class="barber-meta"><span>يبدأ من ${b.price} ل.ت</span><span class="status">${b.available}</span></div><div class="barber-actions"><button class="btn small" onclick="openBooking(${i})">احجز موعداً</button><button class="btn light small" onclick="viewBarber(${i})">الملف الشخصي</button></div></div></article>`).join('')}</div>`}
function customerPage(){if(page==='home'||page==='barbers')return customerHome();if(page==='mybookings')return `${head('حجوزاتي','تابع مواعيدك وحالة كل حجز.')}<section class="card">${bookings.length?table(['الحلاق','الخدمة','التاريخ','الوقت','الحالة'],bookings.map(b=>[b.barber,b.service,b.date,b.time,'<span class="status pending">بانتظار تأكيد الصالون</span>'])):'<div class="empty">لا توجد حجوزات حتى الآن. تصفح الحلاقين واحجز موعدك الأول.</div>'}</section>`;if(page==='favorites')return `${head('المفضلة','الحلاقون الذين أضفتهم إلى قائمتك.')}<div class="empty">لم تضف أي حلاق إلى المفضلة بعد.</div>`;if(page==='account')return `${head('حسابي','إدارة بياناتك الشخصية.')}<section class="card"><div class="form-grid"><div class="field"><label>الاسم الكامل</label><input placeholder="اكتب اسمك"></div><div class="field"><label>رقم الهاتف</label><input placeholder="رقم الهاتف"></div><div class="field"><label>البريد الإلكتروني</label><input placeholder="البريد الإلكتروني"></div></div><p><button class="btn" onclick="toast('تم حفظ البيانات التجريبية')">حفظ البيانات</button></p></section>`;return `${head('الدعم والمساعدة','كيف يمكننا مساعدتك؟')}<section class="card"><div class="field"><label>رسالتك</label><input placeholder="اكتب استفسارك"></div><p><button class="btn" onclick="toast('تم تسجيل طلب الدعم التجريبي')">إرسال</button></p></section>`}
function render(){navRender();let main=document.getElementById('main');main.innerHTML=role==='admin'?adminPage():role==='barber'?barberPage():customerPage()}
function openBooking(i){selectedBarber=barbers[i];document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>حجز موعد لدى ${selectedBarber.name}</h3><div class="notice">اختر الخدمة والتاريخ والوقت المناسب. سيتم إرسال طلب الحجز إلى الحلاق لتأكيده.</div><div class="form-grid"><div class="field"><label>اسمك</label><input id="bookName" placeholder="الاسم الكامل"></div><div class="field"><label>رقم الهاتف</label><input id="bookPhone" placeholder="رقم الهاتف"></div><div class="field"><label>الخدمة</label><select id="bookService"><option>قص شعر</option><option>قص شعر ولحية</option><option>تحديد لحية</option></select></div><div class="field"><label>التاريخ</label><input id="bookDate" type="date" min="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>الوقت</label><select id="bookTime"><option>10:00</option><option>10:30</option><option>11:00</option><option>11:30</option><option>12:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option></select></div></div><div class="modal-actions"><button class="btn" onclick="submitBooking()">تأكيد طلب الحجز</button><button class="btn light" onclick="closeModal()">إلغاء</button></div></div></div>`}
function submitBooking(){let name=document.getElementById('bookName').value.trim(),phone=document.getElementById('bookPhone').value.trim(),date=document.getElementById('bookDate').value;if(!name||!phone||!date){toast('يرجى إدخال الاسم والهاتف والتاريخ');return}bookings.push({barber:selectedBarber.name,name,phone,service:document.getElementById('bookService').value,date,time:document.getElementById('bookTime').value});save();closeModal();toast('تم إرسال طلب الحجز بنجاح');}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function viewBarber(i){let b=barbers[i];document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>${b.name}</h3><p class="muted">${b.shop} • ★ ${b.rating}</p><div class="notice">يمكنك اختيار هذا الحلاق وحجز خدمة من الخدمات المتاحة لديه.</div>${table(['الخدمة','السعر'],[['قص شعر','120 ل.ت'],['قص شعر ولحية','170 ل.ت'],['تحديد لحية','70 ل.ت']])}<div class="modal-actions"><button class="btn" onclick="closeModal();openBooking(${barbers.indexOf(b)})">احجز عند هذا الحلاق</button><button class="btn light" onclick="closeModal()">إغلاق</button></div></div></div>`}
function addItem(p){let labels={shops:'إضافة صالون',subscriptions:'إنشاء باقة',users:'إضافة مستخدم',reports:'تصدير التقرير',settings:'إعدادات المنصة',support:'تذكرة دعم'};document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>${labels[p]||'إضافة'}</h3><div class="field"><label>الاسم أو العنوان</label><input id="newItem" placeholder="أدخل البيانات"></div><div class="field" style="margin-top:12px"><label>ملاحظات</label><input placeholder="معلومات إضافية (اختياري)"></div><div class="modal-actions"><button class="btn" onclick="toast('تم تسجيل الطلب في النموذج التجريبي');closeModal()">حفظ</button><button class="btn light" onclick="closeModal()">إلغاء</button></div></div></div>`}
render();
</script>
</body>
</html>
